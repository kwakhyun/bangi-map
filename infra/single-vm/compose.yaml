# Private, low-traffic staging. Compose 2.24+; load pre-built amd64 images first.
# Usage: docker compose --env-file /private/path/compose.env -f infra/single-vm/compose.yaml up -d
name: fieldtwin-small

x-runtime: &runtime
  platform: linux/amd64
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=128m"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
  stop_grace_period: 90s

services:
  db:
    <<: *runtime
    image: ${POSTGRES_IMAGE:-fieldtwin-postgres:0.2.0}
    user: "999:999"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database administrator password}
    volumes: [data:/var/lib/postgresql/data]
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=64m"
      - "/var/run/postgresql:rw,nosuid,nodev,uid=999,gid=999"
    networks: [database]
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  fieldtwin-api:
    <<: *runtime
    image: ${API_IMAGE:-fieldtwin-api:0.6.2}
    user: "10001:10001"
    env_file:
      - path: ${FIELD_TWIN_RUNTIME_DIR:?Set an absolute private runtime directory}/api.env
        required: false
    environment:
      FIELD_TWIN_ENV: staging
      FIELD_TWIN_DEMO: "false"
      FLYWAY_ENABLED: "false"
      COOKIE_SECURE: "true"
      ALLOWED_ORIGIN: https://localhost:8443
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    networks: [application, database, api-outbound]
    mem_limit: 1024m
    cpus: 1.0
    depends_on: { db: { condition: service_healthy } }

  web:
    <<: *runtime
    image: ${WEB_IMAGE:-fieldtwin-web:0.6.2}
    user: "101:101"
    ports: [127.0.0.1:8443:8443]
    volumes:
      - ./tls.conf:/etc/nginx/conf.d/tls.conf:ro
      - ${FIELD_TWIN_RUNTIME_DIR}/tls/server.crt:/etc/nginx/server.crt:ro
      - ${FIELD_TWIN_RUNTIME_DIR}/tls/server.key:/etc/nginx/server.key:ro
    networks: [application, web-entry]
    mem_limit: 256m
    cpus: 0.5
    depends_on: [fieldtwin-api]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  migrate-api:
    <<: *runtime
    profiles: [maintenance]
    restart: "no"
    image: ${API_IMAGE:-fieldtwin-api:0.6.2}
    user: "10001:10001"
    env_file:
      - path: ${FIELD_TWIN_RUNTIME_DIR}/owner.env
        required: false
    command: [--migrate]
    networks: [database]
    mem_limit: 768m

  bootstrap:
    <<: *runtime
    profiles: [maintenance]
    restart: "no"
    image: ${API_IMAGE:-fieldtwin-api:0.6.2}
    user: "10001:10001"
    env_file:
      - path: ${FIELD_TWIN_RUNTIME_DIR}/owner.env
        required: false
      - path: ${FIELD_TWIN_RUNTIME_DIR}/bootstrap.env
        required: false
    command: [--bootstrap]
    networks: [database]
    mem_limit: 768m

networks:
  application: { internal: true }
  database: { internal: true }
  api-outbound: {}
  web-entry:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  data: {}
