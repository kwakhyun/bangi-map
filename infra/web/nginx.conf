server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;
  server_tokens off;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' data: blob: https://tile.openstreetmap.org; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ {
    proxy_pass http://fieldtwin-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 80s;
  }
  location /health { access_log off; return 200 'ok'; }
  # The official SDK writes inline bootstrap scripts. Scope this policy to its
  # separate document; the React app keeps its stricter script policy above.
  location /realistic3d/ {
    alias /opt/bangi-vworld/;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://map.vworld.kr; style-src 'self' 'unsafe-inline' https://map.vworld.kr; img-src 'self' data: blob: https://*.vworld.kr; connect-src 'self' data: blob: https://*.vworld.kr; worker-src 'self' blob: https://map.vworld.kr; font-src 'self' data: https://map.vworld.kr; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" always;
  }
  location /gis/ { try_files $uri =404; expires 1h; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location = /index.html { expires -1; }
  location / { try_files $uri $uri/ /index.html; }
}
