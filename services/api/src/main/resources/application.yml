server:
  port: ${API_PORT:8080}
  address: ${API_BIND:127.0.0.1}
  shutdown: graceful
  error:
    include-message: never
spring:
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/fieldtwin}
    username: ${DATABASE_USER:fieldtwin}
    password: ${DATABASE_PASSWORD:fieldtwin-local-only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
fieldtwin:
  environment: ${FIELD_TWIN_ENV:local}
  demo: ${FIELD_TWIN_DEMO:true}
  allowed-origin: ${ALLOWED_ORIGIN:http://127.0.0.1:5173}
  cookie-secure: ${COOKIE_SECURE:false}
