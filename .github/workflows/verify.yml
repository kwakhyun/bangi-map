name: Verify and deploy Bangi Map
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  # Never interrupt a main rollout between stopping and restoring containers.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci
      - name: Build and unit tests
        run: |
          npm run typecheck
          npm run build
          node --test tests/vworld3d.test.mjs
          python3 -m unittest discover -s tests -p 'test_cicd.py' -v
          bash scripts/mvn.sh package -q
          npm audit --omit=dev --audit-level=high
      - name: Prepare an isolated test database
        run: |
          docker build -t fieldtwin-postgres:ci infra/postgres
          docker run -d --name fieldtwin-ci-db -p 127.0.0.1:55432:5432 -e POSTGRES_DB=fieldtwin_bangi -e POSTGRES_USER=fieldtwin -e POSTGRES_PASSWORD=fieldtwin-local-only fieldtwin-postgres:ci
          mkdir -p .runtime evidence
          for attempt in $(seq 1 60); do
            if docker exec fieldtwin-ci-db pg_isready -U fieldtwin; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify report concurrency and rollback against PostgreSQL
        run: |
          docker exec fieldtwin-ci-db createdb -U fieldtwin bangi_refactor_ci
          BANGI_TEST_DATABASE=jdbc:postgresql://127.0.0.1:55432/bangi_refactor_ci bash scripts/mvn.sh test -q -Dtest=ReportConcurrencyTest -DargLine=-Djava.awt.headless=true
      - name: Start the local application without external provider keys
        run: |
          npm run dev > .runtime/ci-dev.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows without paid provider calls
        run: SOFTWARE_WEBGL=1 npm run test:e2e
      - name: Store verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification
          retention-days: 7
          path: |
            playwright-report/
            test-results/
            services/api/target/surefire-reports/
      - name: Stop application
        if: always()
        run: npm run stop

  package:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Build immutable amd64 images without runtime secrets
        run: |
          set -euo pipefail
          for service in web api; do
            if [ "$service" = web ]; then dockerfile=apps/web/Dockerfile; else dockerfile=services/api/Dockerfile; fi
            docker buildx build --platform linux/amd64 --load \
              --build-arg SOURCE_REVISION="$GITHUB_SHA" \
              -f "$dockerfile" -t "fieldtwin-$service:sha-$GITHUB_SHA" .
          done
          mkdir -p .runtime/release
          docker save "fieldtwin-web:sha-$GITHUB_SHA" "fieldtwin-api:sha-$GITHUB_SHA" | gzip > .runtime/release/images.tar.gz
          python3 scripts/cicd/release.py "$GITHUB_SHA" .runtime/release/images.tar.gz > .runtime/release/manifest.json
      - name: Publish the verified release bundle
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ncp-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'Verified main commit %s. App-only NCP deployment bundle; no runtime secrets.\n' "$GITHUB_SHA" > .runtime/release/notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "NCP ${GITHUB_SHA:0:12}" --notes-file .runtime/release/notes.md \
            .runtime/release/manifest.json .runtime/release/images.tar.gz
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [verify, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: '22'}
      - name: Request deployment and wait for NCP health checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
        run: |
          mkdir -p .runtime/release
          gh release download "$RELEASE_TAG" --pattern manifest.json --dir .runtime/release
          node scripts/cicd/request-deploy.mjs
